[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26126-ugv"
version = "0.1.0"
description = "Vision-Based Autonomous Navigation for UGV in GPS-Denied Outdoor Environments (SIH26126)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "SIH26126 Team", email = "ugv-team@sih2026.internal" }
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "opencv-python>=4.8.0",
    "pillow>=9.5.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0"
]
cloud = [
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "timm>=0.9.0",
    "segmentation-models-pytorch>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ugv_*", "ai*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "."]
