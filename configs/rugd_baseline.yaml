  backbone: "mobilenet_v3_small"
  num_classes: 3
  class_labels:
    0: "SAFE"
    1: "UNKNOWN"
    2: "UNSAFE"
  ignore_index: 255
  parameter_count: 1152067
  model_size_mb: 4.55

checkpoint:
  primary: "models/rugd_traversability/outputs/checkpoints/best.pt"
